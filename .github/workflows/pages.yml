name: Deploy OpenMath WebApp to GitHub Pages

on:
  push:
    branches:
      - main
      - webapp-khara
    paths:
      - 'web/**'
      - 'cas_engine/**'
      - '.github/workflows/pages.yml'
      - 'index.html'
      - '.nojekyll'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build WebApp Assets & CAS Bundle
        run: |
          python web/bundle_cas.py
          mkdir -p web/cas_engine
          cp -r cas_engine/*.py web/cas_engine/
          cp resources/AppIcon.png web/favicon.png
          touch web/.nojekyll

      - name: Setup Pages
        id: pages_setup
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: Deploy to gh-pages branch (Branch mode)
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          force_orphan: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
